[project]
name = "knowledge-base"
version = "0.1.0"
description = "企业知识库检索系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "chromadb>=1.5.9",
    "sentence-transformers>=3.0.0",
    "python-dotenv>=1.0.0",
    "PyMuPDF>=1.24.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.0",
    "openpyxl>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "rank-bm25>=0.2.0",
    "jieba>=0.42.0",
    "httpx>=0.27.0",
    "streamlit>=1.36.0",
    "pyjwt>=2.8.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "aiofiles>=24.1.0",
    "python-multipart>=0.0.9",
    "openai>=1.0.0",
]
